<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ACCEL KEYS</title><meta name="description" content="ノーツとともに加速する4レーン鍵盤ゲーム"><style>
:root{color-scheme:dark;--lime:#adff2f;--red:#ff4964;--panel:#0b1114;--line:#2a353a;--muted:#808c92}*{box-sizing:border-box}body{margin:0;background:#05090b;color:#f4f7f5;font-family:"Arial Narrow","Noto Sans JP",Arial,sans-serif}.app{min-height:100svh;background:radial-gradient(circle at 50% 20%,#16251b,#071012 43%,#050709 80%)}header{height:66px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(16px,5vw,60px);border-bottom:1px solid var(--line);letter-spacing:.15em}.logo{font-weight:950}.logo b{display:inline-grid;place-items:center;width:27px;height:27px;margin-right:9px;background:var(--lime);color:#071006;clip-path:polygon(50% 0,100% 100%,0 100%);padding-top:8px}.bests{font-size:10px;color:var(--muted)}.bests strong{font-size:16px;color:#fff;margin-left:5px}.world{margin-left:15px;color:#879d70}.stage{width:min(820px,calc(100% - 24px));margin:auto;padding:14px 0 40px}.stats{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);background:#0b1114}.stat{display:flex;justify-content:space-between;align-items:baseline;padding:10px 15px;border-right:1px solid var(--line)}.stat:last-child{border:0}.stat span{font-size:10px;letter-spacing:.16em;color:var(--muted)}.stat b{font-size:23px;font-variant-numeric:tabular-nums}.stat .lime{color:var(--lime)}.speedbar{height:3px;background:#1d272b}.speedbar i{display:block;width:12.5%;height:100%;background:var(--lime);box-shadow:0 0 12px var(--lime)}.game{height:min(57vh,530px);min-height:360px;position:relative;border:1px solid var(--line);border-top:0;background:#060b0dcf;overflow:hidden}canvas{display:block;width:100%;height:100%;touch-action:none}.overlay{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px;pointer-events:none}.intro .eyebrow,.result .eyebrow{font-size:11px;letter-spacing:.3em;color:var(--muted);font-weight:900}.intro h1{font-size:clamp(38px,7vw,67px);line-height:1.02;letter-spacing:-.055em;margin:10px 0}.intro h1 em{font-style:normal;color:var(--lime)}.intro p{color:#929ca1;line-height:1.7;font-size:14px}.count{font-size:140px;font-weight:950;color:var(--lime);text-shadow:0 0 40px #adff2f55}.judge{font-size:clamp(30px,8vw,58px);font-weight:950;letter-spacing:.04em;text-shadow:0 0 22px currentColor;transform:translateY(25%)}.perfect{color:var(--lime)}.great{color:#54e8ff}.good{color:#ffe66a}.miss{color:var(--red)}.result h2{font-size:clamp(65px,14vw,112px);line-height:1;color:var(--lime);margin:6px}.resultline{display:flex;gap:18px;justify-content:center;color:#8f999e;font-size:13px}.resultline b{color:#fff}.life{height:20px;display:flex;align-items:center;justify-content:center;gap:8px}.life i{width:25px;height:4px;background:#3b474c}.life i.lost{background:var(--red);box-shadow:0 0 8px var(--red)}.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.keys button{height:70px;border:1px solid #3b474b;border-bottom:5px solid #020304;border-radius:0 0 7px 7px;background:linear-gradient(#20292d,#0e1417);color:#eef2ef;font-size:25px;font-weight:950;touch-action:manipulation}.keys button.active,.keys button:active{transform:translateY(4px);border-bottom-width:1px;background:var(--lime);color:#071006;box-shadow:0 0 18px #adff2f77}.controls{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:14px}.modes{display:grid;grid-template-columns:1fr 1fr;gap:7px}.modes button,.start{border:1px solid var(--line);border-radius:6px;background:#0b1114;color:#9aa4a9;padding:10px 13px;text-align:left;font-weight:850}.modes small{display:block;color:#657176;margin-top:3px}.modes .on{color:var(--lime);border-color:var(--lime);background:#101b0e}.start{min-width:170px;text-align:center;background:var(--lime);color:#071006;border:0;font-size:16px;cursor:pointer}.submit{margin-top:12px;display:none;grid-template-columns:1fr auto;gap:7px}.submit input{min-width:0;background:#0b1114;border:1px solid var(--line);border-radius:6px;color:#fff;padding:12px;font-size:16px}.submit button{border:0;border-radius:6px;background:var(--lime);color:#071006;padding:0 17px;font-weight:900}.message{text-align:center;color:#94a0a5;font-size:13px;min-height:18px}.ranking{margin-top:17px;border-top:1px solid var(--line);padding-top:14px}.ranking h3{margin:0 0 8px;color:var(--muted);font-size:11px;letter-spacing:.18em}.ranking ol{list-style:none;margin:0;padding:0;display:grid;gap:4px}.ranking li{display:grid;grid-template-columns:30px 1fr auto auto;gap:9px;background:#0b1114;border:1px solid #222c30;border-radius:5px;padding:8px 10px;font-size:12px}.ranking li b{color:var(--lime)}.ranking li small{color:#667278}.back{display:block;text-align:center;margin-top:20px;color:#707d83;font-size:12px}@media(max-width:600px){header{height:58px;padding:0 13px}.bests{font-size:8px}.world{display:block;margin:2px 0 0}.stage{padding-top:9px}.stat{display:block;text-align:center;padding:8px 4px}.stat span{display:block}.stat b{font-size:21px}.game{height:52vh;min-height:350px}.keys button{height:62px}.controls{grid-template-columns:1fr}.start{height:50px}.ranking li{grid-template-columns:26px 1fr auto}.ranking li small{display:none}.intro p br{display:none}}
</style></head><body><div class="app"><header><div class="logo"><b>A</b>ACCEL KEYS</div><div class="bests">MY BEST <strong id="myBest">0</strong><span class="world">WORLD <strong id="worldBest">---</strong></span></div></header><main class="stage"><section class="stats"><div class="stat"><span>SCORE</span><b id="score">0</b></div><div class="stat"><span>COMBO</span><b id="combo">0</b></div><div class="stat"><span>SPEED</span><b class="lime" id="speed">×1.00</b></div></section><div class="speedbar"><i id="speedFill"></i></div><section class="game" id="game"><canvas id="canvas"></canvas><div class="overlay" id="overlay"><div class="intro"><div class="eyebrow">FALLING NOTES × ACCELERATION</div><h1>落ちてくるほど、<br><em>加速する。</em></h1><p>ノーツが判定ラインに重なった瞬間、D・F・J・Kを叩こう。<br>3回ミスでゲームオーバー。</p></div></div></section><div class="life" id="life"><i></i><i></i><i></i></div><div class="keys" id="keys"></div><section class="controls" id="controls"><div class="modes"><button class="on" data-mode="time">時間で加速<small>12秒ごとに約＋1倍</small></button><button data-mode="hits">打数で加速<small>10打ごとに＋0.35倍</small></button></div><button class="start" id="start">スタート</button></section><form class="submit" id="submit"><input id="player" maxlength="12" placeholder="プレイヤー名（12文字まで）" required><button>スコア送信</button></form><p class="message" id="message"></p><section class="ranking"><h3>GLOBAL TOP 10</h3><ol id="ranking"><li><span>—</span><span>読み込み中…</span></li></ol></section><a class="back" href="/">← ゲーム一覧へ戻る</a></main></div><script>
(()=>{const K=['D','F','J','K'],q=s=>document.querySelector(s),canvas=q('#canvas'),ctx=canvas.getContext('2d'),overlay=q('#overlay'),keys=q('#keys');let mode='time',phase='idle',notes=[],score=0,combo=0,bestCombo=0,miss=0,speed=1,maxSpeed=1,hits=0,startAt=0,lastAt=0,lastSpawn=0,lastLane=-1,raf=0,judgeTimer=0,activeLane=-1;const myBest=Number(localStorage.getItem('accel-keys-best')||0);q('#myBest').textContent=myBest.toLocaleString();K.forEach((k,i)=>{const b=document.createElement('button');b.textContent=k;b.onpointerdown=e=>{e.preventDefault();press(i)};keys.append(b)});document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('on',x===b))});function resize(){const r=canvas.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d);ctx.setTransform(d,0,0,d,0,0);draw()}addEventListener('resize',resize);new ResizeObserver(resize).observe(canvas);function dims(){return{w:canvas.clientWidth,h:canvas.clientHeight,line:canvas.clientHeight-62,lane:canvas.clientWidth/4}}function draw(){const{w,h,line,lane}=dims();ctx.clearRect(0,0,w,h);ctx.fillStyle='#070d0f';ctx.fillRect(0,0,w,h);for(let i=0;i<4;i++){ctx.fillStyle=i%2?'#0b1316':'#081013';ctx.fillRect(i*lane,0,lane,h);ctx.strokeStyle='#28343a';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(i*lane,0);ctx.lineTo(i*lane,h);ctx.stroke()}ctx.strokeStyle='#adff2f';ctx.lineWidth=3;ctx.shadowColor='#adff2f';ctx.shadowBlur=13;ctx.beginPath();ctx.moveTo(0,line);ctx.lineTo(w,line);ctx.stroke();ctx.shadowBlur=0;notes.forEach(n=>{const x=n.lane*lane+7,y=n.y,nw=lane-14,nh=22;const grad=ctx.createLinearGradient(x,y,x+nw,y);grad.addColorStop(0,'#73dfff');grad.addColorStop(.5,'#eaffff');grad.addColorStop(1,'#adff2f');ctx.fillStyle=grad;ctx.shadowColor='#adff2f';ctx.shadowBlur=11;ctx.fillRect(x,y,nw,nh);ctx.fillStyle='#071006';ctx.font='900 13px Arial';ctx.textAlign='center';ctx.fillText(K[n.lane],x+nw/2,y+16);ctx.shadowBlur=0});ctx.font='900 14px Arial';ctx.textAlign='center';for(let i=0;i<4;i++){ctx.fillStyle='#738087';ctx.fillText(K[i],i*lane+lane/2,h-17)}}function paint(){q('#score').textContent=score.toLocaleString();q('#combo').textContent=combo;q('#speed').textContent='×'+speed.toFixed(2);q('#speedFill').style.width=Math.min(100,speed/8*100)+'%';[...q('#life').children].forEach((x,i)=>x.classList.toggle('lost',i<miss));[...keys.children].forEach((x,i)=>x.classList.toggle('active',i===activeLane))}function spawn(){let lane=Math.floor(Math.random()*4);if(lane===lastLane&&Math.random()<.72)lane=(lane+1+Math.floor(Math.random()*3))%4;lastLane=lane;notes.push({lane,y:-28})}function showJudge(text,cls){clearTimeout(judgeTimer);overlay.innerHTML='<div class="judge '+cls+'">'+text+'</div>';judgeTimer=setTimeout(()=>{if(phase==='playing')overlay.innerHTML=''},260)}function addMiss(){miss++;combo=0;showJudge('MISS','miss');paint();if(miss>=3)end()}function press(lane){if(phase!=='playing')return;activeLane=lane;paint();setTimeout(()=>{if(activeLane===lane){activeLane=-1;paint()}},85);const{line}=dims();let best=-1,dist=Infinity;notes.forEach((n,i)=>{if(n.lane===lane){const d=Math.abs((n.y+11)-line);if(d<dist){dist=d;best=i}}});if(best<0||dist>76)return;notes.splice(best,1);let value,label,cls;if(dist<=20){value=100;label='PERFECT';cls='perfect'}else if(dist<=42){value=80;label='GREAT';cls='great'}else{value=50;label='GOOD';cls='good'}combo++;hits++;bestCombo=Math.max(bestCombo,combo);score+=Math.round(value*speed*(1+Math.min(combo,50)*.01));if(mode==='hits')speed=Math.min(8,1+Math.floor(hits/10)*.35);maxSpeed=Math.max(maxSpeed,speed);showJudge(label,cls);paint()}function loop(now){if(phase!=='playing')return;const dt=Math.min(34,now-lastAt);lastAt=now;if(mode==='time')speed=Math.min(8,1+(now-startAt)/12000);maxSpeed=Math.max(maxSpeed,speed);const interval=Math.max(135,940/speed);if(now-lastSpawn>=interval){spawn();lastSpawn=now}const{line}=dims(),velocity=.29*speed;notes.forEach(n=>n.y+=velocity*dt);for(let i=notes.length-1;i>=0;i--){if(notes[i].y>line+82){notes.splice(i,1);addMiss();if(phase!=='playing')break}}draw();paint();raf=requestAnimationFrame(loop)}function start(){cancelAnimationFrame(raf);phase='count';notes=[];score=combo=bestCombo=miss=hits=0;speed=maxSpeed=1;activeLane=-1;paint();q('#controls').style.display='none';q('#submit').style.display='none';q('#message').textContent='';let n=3;overlay.innerHTML='<div class="count">3</div>';draw();const t=setInterval(()=>{n--;if(!n){clearInterval(t);phase='playing';overlay.innerHTML='';startAt=lastAt=performance.now();lastSpawn=startAt-500;raf=requestAnimationFrame(loop)}else overlay.innerHTML='<div class="count">'+n+'</div>'},700)}function end(){phase='over';cancelAnimationFrame(raf);const old=Number(localStorage.getItem('accel-keys-best')||0),best=Math.max(old,score);localStorage.setItem('accel-keys-best',best);q('#myBest').textContent=best.toLocaleString();overlay.innerHTML='<div class="result"><div class="eyebrow">RUN COMPLETE</div><h2>'+score.toLocaleString()+'</h2><div class="resultline"><span>最高コンボ <b>'+bestCombo+'</b></span><span>最高速度 <b>×'+maxSpeed.toFixed(2)+'</b></span></div></div>';q('#controls').style.display='grid';q('#start').textContent='もう一度';q('#submit').style.display=score>0?'grid':'none';paint()}q('#start').onclick=start;addEventListener('keydown',e=>{const lane=K.indexOf(e.key.toUpperCase());if(lane>=0&&!e.repeat){e.preventDefault();press(lane)}if(e.key===' '&&(phase==='idle'||phase==='over')){e.preventDefault();start()}});function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}async function rankings(){try{const r=await fetch('/api/scores'),d=await r.json();if(!r.ok)throw Error();q('#worldBest').textContent=Number(d.worldBest||0).toLocaleString();q('#ranking').innerHTML=d.scores.length?d.scores.map((x,i)=>'<li><span>'+(i+1)+'</span><span>'+esc(x.name)+'</span><b>'+Number(x.score).toLocaleString()+'</b><small>'+(x.mode==='hits'?'打数':'時間')+' ×'+Number(x.maxSpeed).toFixed(2)+'</small></li>').join(''):'<li><span>—</span><span>まだ記録がありません</span></li>'}catch{q('#ranking').innerHTML='<li><span>!</span><span>ランキングに接続できません</span></li>';q('#worldBest').textContent='OFFLINE'}}q('#submit').onsubmit=async e=>{e.preventDefault();const b=e.currentTarget.querySelector('button');b.disabled=true;q('#message').textContent='送信中…';try{const r=await fetch('/api/scores',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name:q('#player').value,score,mode,maxSpeed,bestCombo})}),d=await r.json();if(!r.ok)throw Error(d.error);q('#message').textContent='ランキングに登録しました！';q('#submit').style.display='none';await rankings()}catch(x){q('#message').textContent=x.message||'送信できませんでした'}finally{b.disabled=false}};rankings();paint();resize()})();
</script></body></html>
