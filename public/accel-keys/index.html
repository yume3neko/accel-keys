<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>ACCEL KEYS</title>
    <style>
      :root {
        color-scheme: dark;
        --lime: #adff2f;
        --red: #ff4964;
        --line: #2a353a;
        --muted: #808c92;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #05090b;
        color: #f4f7f5;
        font-family: "Arial Narrow", "Noto Sans JP", Arial, sans-serif;
      }
      .app {
        min-height: 100svh;
        background: radial-gradient(
          circle at 50% 20%,
          #16251b,
          #071012 43%,
          #050709 80%
        );
      }
      header {
        height: 62px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 clamp(14px, 5vw, 58px);
        border-bottom: 1px solid var(--line);
        letter-spacing: 0.14em;
      }
      .logo {
        font-weight: 950;
      }
      .logo b {
        display: inline-grid;
        place-items: center;
        width: 27px;
        height: 27px;
        margin-right: 8px;
        background: var(--lime);
        color: #071006;
        clip-path: polygon(50% 0, 100% 100%, 0 100%);
        padding-top: 8px;
      }
      .bests {
        font-size: 9px;
        color: var(--muted);
      }
      .bests strong {
        font-size: 15px;
        color: #fff;
        margin-left: 4px;
      }
      .world {
        margin-left: 13px;
        color: #879d70;
      }
      .stage {
        width: min(820px, calc(100% - 24px));
        margin: auto;
        padding: 12px 0 36px;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        border: 1px solid var(--line);
        background: #0b1114;
      }
      .stat {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        padding: 9px 14px;
        border-right: 1px solid var(--line);
      }
      .stat:last-child {
        border: 0;
      }
      .stat span {
        font-size: 10px;
        letter-spacing: 0.14em;
        color: var(--muted);
      }
      .stat b {
        font-size: 22px;
      }
      .stat .lime {
        color: var(--lime);
      }
      .speedbar {
        height: 3px;
        background: #1d272b;
      }
      .speedbar i {
        display: block;
        width: 12.5%;
        height: 100%;
        background: var(--lime);
        box-shadow: 0 0 12px var(--lime);
      }
      .game {
        height: min(53vh, 500px);
        min-height: 340px;
        position: relative;
        border: 1px solid var(--line);
        border-top: 0;
        background: #060b0d;
        overflow: hidden;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
        cursor: pointer;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      .overlay {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        text-align: center;
        padding: 18px;
        pointer-events: none;
      }
      .eyebrow {
        font-size: 10px;
        letter-spacing: 0.3em;
        color: var(--muted);
        font-weight: 900;
      }
      .intro {
        padding: 18px;
        background: #071012aa;
        border-radius: 12px;
        backdrop-filter: blur(2px);
      }
      .intro h1 {
        font-size: clamp(36px, 7vw, 64px);
        line-height: 1.02;
        letter-spacing: -0.05em;
        margin: 9px;
      }
      .intro h1 em {
        font-style: normal;
        color: var(--lime);
      }
      .intro p {
        color: #a0aaae;
        line-height: 1.65;
        font-size: 13px;
      }
      .count {
        font-size: 130px;
        font-weight: 950;
        color: var(--lime);
        text-shadow: 0 0 38px #adff2f55;
      }
      .judge {
        font-size: clamp(29px, 8vw, 54px);
        font-weight: 950;
        text-shadow: 0 0 22px currentColor;
      }
      .perfect {
        color: var(--lime);
      }
      .great {
        color: #54e8ff;
      }
      .good {
        color: #ffe66a;
      }
      .miss {
        color: var(--red);
      }
      .result h2 {
        font-size: clamp(62px, 14vw, 108px);
        line-height: 1;
        color: var(--lime);
        margin: 6px;
      }
      .resultline {
        display: flex;
        flex-wrap: wrap;
        gap: 7px 17px;
        justify-content: center;
        color: #8f999e;
        font-size: 12px;
      }
      .resultline b {
        color: #fff;
      }
      .keys {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 6px;
      }
      .keys button {
        height: 64px;
        border: 1px solid #3b474b;
        border-bottom: 5px solid #020304;
        border-radius: 0 0 7px 7px;
        background: linear-gradient(#20292d, #0e1417);
        color: #eef2ef;
        font-size: 24px;
        font-weight: 950;
        touch-action: manipulation;
      }
      .keys button.active,
      .keys button:active {
        transform: translateY(3px);
        border-bottom-width: 2px;
        background: var(--lime);
        color: #071006;
        box-shadow: 0 0 18px #adff2f77;
      }
      .hsbox {
        margin-top: 10px;
        padding: 10px 13px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #0b1114;
        display: grid;
        grid-template-columns: auto 1fr auto;
        gap: 11px;
        align-items: center;
      }
      .hsbox label {
        font-size: 11px;
        font-weight: 900;
        letter-spacing: 0.1em;
      }
      .hsbox input {
        width: 100%;
        accent-color: var(--lime);
      }
      .hsvalue {
        text-align: right;
        min-width: 102px;
        color: var(--lime);
        font-weight: 900;
      }
      .hsvalue small {
        display: block;
        color: #7b878c;
        font-size: 9px;
      }
      .controls {
        margin-top: 7px;
      }
      .demo-toggle {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 7px;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #0b1114;
        color: #c7d0d3;
        font-size: 13px;
        font-weight: 800;
        cursor: pointer;
      }
      .demo-toggle input {
        width: 18px;
        height: 18px;
        margin: 0;
        accent-color: var(--lime);
      }
      .demo-toggle small {
        margin-left: auto;
        color: #778388;
        font-size: 10px;
      }
      .start {
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #0b1114;
        color: #9aa4a9;
        padding: 9px 12px;
        text-align: left;
        font-weight: 850;
      }
      .start {
        width: 100%;
        text-align: center;
        background: var(--lime);
        color: #071006;
        border: 0;
        font-size: 16px;
      }
      .submit {
        margin-top: 10px;
        display: none;
        grid-template-columns: 1fr auto;
        gap: 7px;
      }
      .submit input {
        min-width: 0;
        background: #0b1114;
        border: 1px solid var(--line);
        border-radius: 6px;
        color: #fff;
        padding: 11px;
        font-size: 16px;
      }
      .submit button {
        border: 0;
        border-radius: 6px;
        background: var(--lime);
        color: #071006;
        padding: 0 15px;
        font-weight: 900;
      }
      .message {
        text-align: center;
        color: #94a0a5;
        font-size: 12px;
        min-height: 17px;
      }
      .ranking {
        margin-top: 15px;
        border-top: 1px solid var(--line);
        padding-top: 12px;
      }
      .ranking h3 {
        margin: 0 0 7px;
        color: var(--muted);
        font-size: 10px;
        letter-spacing: 0.18em;
      }
      .ranking ol {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 4px;
      }
      .ranking li {
        display: grid;
        grid-template-columns: 28px 1fr auto auto;
        gap: 8px;
        background: #0b1114;
        border: 1px solid #222c30;
        border-radius: 5px;
        padding: 8px 9px;
        font-size: 12px;
      }
      .ranking li[data-id] {
        cursor: pointer;
        touch-action: manipulation;
      }
      .ranking li[data-id]:hover,
      .ranking li[data-id]:active {
        border-color: #759f3b;
        background: #101a16;
      }
      .ranking li b {
        color: var(--lime);
      }
      .ranking li small {
        color: #667278;
      }
      .back {
        display: block;
        text-align: center;
        margin-top: 18px;
        color: #707d83;
        font-size: 12px;
      }
      .replay-modal {
        position: fixed;
        z-index: 100;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 14px;
        background: #020506dd;
        backdrop-filter: blur(6px);
      }
      .replay-modal[hidden] {
        display: none;
      }
      .replay-card {
        width: min(680px, 100%);
        max-height: calc(100svh - 28px);
        overflow: auto;
        border: 1px solid #334238;
        border-radius: 10px;
        background: #081013;
        box-shadow: 0 18px 80px #000;
      }
      .replay-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 14px;
        border-bottom: 1px solid var(--line);
      }
      .replay-head h2 {
        margin: 0;
        font-size: 18px;
      }
      .replay-close,
      .replay-play {
        border: 0;
        border-radius: 6px;
        background: var(--lime);
        color: #071006;
        padding: 8px 13px;
        font-weight: 900;
      }
      .replay-close {
        background: #202b2f;
        color: #dce4e0;
      }
      .replay-stats {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 1px;
        background: var(--line);
      }
      .replay-stats div {
        padding: 9px 6px;
        background: #0b1114;
        text-align: center;
      }
      .replay-stats small {
        display: block;
        color: var(--muted);
        font-size: 9px;
      }
      .replay-stats b {
        color: #fff;
        font-size: 15px;
      }
      .replay-wrap {
        position: relative;
        height: min(48svh, 390px);
        min-height: 280px;
        background: #060b0d;
      }
      #replayCanvas {
        width: 100%;
        height: 100%;
      }
      .replay-judge {
        position: absolute;
        inset: auto 0 25px;
        text-align: center;
        font-size: 32px;
        font-weight: 950;
        text-shadow: 0 0 18px currentColor;
        pointer-events: none;
      }
      .replay-foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 10px 12px;
      }
      .replay-status {
        color: #8f9a9e;
        font-size: 11px;
      }
      body.playing {
        overflow: hidden;
        overscroll-behavior: none;
      }
      body.playing header,
      body.playing .normal-ui {
        display: none !important;
      }
      body.playing .stage {
        position: fixed;
        inset: 0;
        width: 100%;
        padding: 0;
        margin: 0;
      }
      body.playing .stats {
        position: absolute;
        z-index: 5;
        inset: 0 0 auto;
        height: 52px;
        border-width: 0 0 1px;
      }
      body.playing .stat {
        padding: 5px 12px;
      }
      body.playing .speedbar {
        position: absolute;
        z-index: 6;
        top: 52px;
        left: 0;
        right: 0;
      }
      body.playing .game {
        position: absolute;
        inset: 55px 0 72px;
        height: auto;
        min-height: 0;
        border: 0;
      }
      body.playing .keys {
        position: absolute;
        z-index: 9;
        inset: auto 0 0;
        height: 72px;
        gap: 2px;
        background: #05090b;
      }
      body.playing .keys button {
        height: 72px;
        border-radius: 0;
        font-size: 28px;
      }
      body.playing .overlay {
        align-items: end;
        padding-bottom: 35px;
      }
      body.playing .count {
        align-self: center;
      }
      body.playing .judge {
        transform: none;
      }
      @media (max-width: 600px) {
        header {
          height: 56px;
          padding: 0 12px;
        }
        .world {
          display: block;
          margin: 2px 0 0;
        }
        .stage {
          padding-top: 8px;
        }
        .stat {
          display: block;
          text-align: center;
          padding: 7px 3px;
        }
        .stat span {
          display: block;
        }
        .stat b {
          font-size: 20px;
        }
        .game {
          height: 46vh;
          min-height: 315px;
        }
        .keys button {
          height: 58px;
        }
        .hsbox {
          padding: 8px;
          gap: 7px;
        }
        .controls {
          grid-template-columns: 1fr;
        }
        .start {
          height: 47px;
        }
        .ranking li {
          grid-template-columns: 24px 1fr auto;
        }
        .ranking li small {
          display: none;
        }
        .replay-stats {
          grid-template-columns: repeat(2, 1fr);
        }
        body.playing .stat {
          display: flex;
          padding: 4px 9px;
        }
        body.playing .stat span {
          display: block;
          font-size: 8px;
        }
        body.playing .stat b {
          font-size: 18px;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header>
        <div class="logo"><b>A</b>ACCEL KEYS</div>
        <div class="bests">
          MY BEST <strong id="myBest">0</strong
          ><span class="world">WORLD <strong id="worldBest">---</strong></span>
        </div>
      </header>
      <main class="stage">
        <section class="stats">
          <div class="stat"><span>SCORE</span><b id="score">0</b></div>
          <div class="stat"><span>COMBO</span><b id="combo">0</b></div>
          <div class="stat">
            <span>SPEED</span><b class="lime" id="speed">×1.00</b>
          </div>
        </section>
        <div class="speedbar"><i id="speedFill"></i></div>
        <section class="game">
          <canvas id="canvas"></canvas>
          <div class="overlay" id="overlay">
            <div class="intro">
              <div class="eyebrow">LIVE PREVIEW</div>
              <h1>落ちてくるほど、<br /><em>加速する。</em></h1>
              <p>
                判定ラインに重なった瞬間、D・F・J・Kを叩こう。<br />4回ミスでゲームオーバー。
              </p>
            </div>
          </div>
        </section>
        <div class="keys" id="keys"></div>
        <div class="normal-ui">
          <section class="hsbox">
            <label for="hs">HIGH SPEED</label
            ><input id="hs" type="range" min="0.5" max="2" step="0.1" /><output
              class="hsvalue"
              ><span id="hsText"></span><small id="hsBonus"></small
            ></output>
          </section>
          <section class="hsbox">
            <label for="linePosition">判定ライン位置</label
            ><input
              id="linePosition"
              type="range"
              min="-15"
              max="160"
              step="5"
            /><output class="hsvalue"
              ><span id="lineText"></span><small>右ほど上へ移動</small
            ></output>
          </section>
          <section class="controls" id="controls">
            <label class="demo-toggle">
              <input id="demoMode" type="checkbox" />
              おてほんモード
              <small>オートプレイ・記録対象外</small>
            </label>
            <button class="start" id="start">スタート</button>
          </section>
          <form class="submit" id="submit">
            <input
              id="player"
              maxlength="12"
              placeholder="プレイヤー名（12文字まで）"
              required
            /><button>スコア送信</button>
          </form>
          <p class="message" id="message"></p>
          <section class="ranking">
            <h3>GLOBAL TOP 10</h3>
            <ol id="ranking">
              <li><span>—</span><span>読み込み中…</span></li>
            </ol>
          </section>
          <a class="back" href="/">← ゲーム一覧へ戻る</a>
        </div>
      </main>
    </div>
    <div class="replay-modal" id="replayModal" hidden>
      <section class="replay-card" role="dialog" aria-modal="true">
        <div class="replay-head">
          <h2 id="replayTitle">記録詳細</h2>
          <button class="replay-close" id="replayClose" type="button">閉じる</button>
        </div>
        <div class="replay-stats" id="replayStats"></div>
        <div class="replay-wrap">
          <canvas id="replayCanvas"></canvas>
          <div class="replay-judge" id="replayJudge"></div>
        </div>
        <div class="replay-foot">
          <span class="replay-status" id="replayStatus">記録を読み込んでいます…</span>
          <button class="replay-play" id="replayPlay" type="button">最初から再生</button>
        </div>
      </section>
    </div>
    <script>
      (() => {
        const K = ["D", "F", "J", "K"],
          q = (s) => document.querySelector(s),
          canvas = q("#canvas"),
          ctx = canvas.getContext("2d"),
          overlay = q("#overlay"),
          keys = q("#keys"),
          BASE = 0.145;
        let phase = "idle",
          notes = [],
          score = 0,
          combo = 0,
          bestCombo = 0,
          miss = 0,
          perfectCount = 0,
          greatCount = 0,
          goodCount = 0,
          speed = 1,
          maxSpeed = 1,
          startAt = 0,
          lastAt = 0,
          lastSpawn = 0,
          lastLane = -1,
          raf = 0,
          judgeTimer = 0,
          activeLane = -1,
          demoMode = false,
          demoEnding = false,
          replayEvents = [],
          nextNoteId = 1,
          runDuration = 0,
          highSpeed = Math.min(
            2,
            Math.max(
              0.5,
              Math.round(
                Number(localStorage.getItem("accel-keys-hs") || 1) * 10,
              ) / 10,
            ),
          ),
          lineOffset = Math.min(
            160,
            Math.max(
              -15,
              Math.round(
                Number(localStorage.getItem("accel-keys-line-offset") || 0) / 5,
              ) * 5,
            ),
          ),
          previewAt = 0;
        const hsScore = () =>
            highSpeed < 1
              ? 0.6 + (highSpeed - 0.5) * 0.25
              : 1 + (highSpeed - 1) * 0.08,
          myBest = Number(localStorage.getItem("accel-keys-best") || 0);
        q("#myBest").textContent = myBest.toLocaleString();
        q("#hs").value = String(highSpeed);
        function updateHs() {
          highSpeed = Number(q("#hs").value);
          localStorage.setItem("accel-keys-hs", String(highSpeed));
          q("#hsText").textContent = "HS " + highSpeed.toFixed(2);
          q("#hsBonus").textContent = "SCORE ×" + hsScore().toFixed(3);
        }
        q("#hs").oninput = updateHs;
        updateHs();
        q("#linePosition").value = String(lineOffset);
        function updateLinePosition() {
          lineOffset = Number(q("#linePosition").value);
          localStorage.setItem(
            "accel-keys-line-offset",
            String(lineOffset),
          );
          q("#lineText").textContent =
            lineOffset === 0
              ? "標準"
              : lineOffset > 0
                ? "上へ " + lineOffset + "px"
                : "下へ " + Math.abs(lineOffset) + "px";
          draw();
        }
        q("#linePosition").oninput = updateLinePosition;
        updateLinePosition();
        K.forEach((k, i) => {
          const b = document.createElement("button");
          b.textContent = k;
          b.onpointerdown = (e) => {
            e.preventDefault();
            press(i);
          };
          keys.append(b);
        });
        canvas.onpointerdown = (e) => {
          e.preventDefault();
          const r = canvas.getBoundingClientRect(),
            lane = Math.min(
              3,
              Math.max(0, Math.floor((e.clientX - r.left) / (r.width / 4))),
            );
          press(lane);
        };
        function resize() {
          const r = canvas.getBoundingClientRect(),
            d = Math.min(devicePixelRatio || 1, 2);
          canvas.width = Math.round(r.width * d);
          canvas.height = Math.round(r.height * d);
          ctx.setTransform(d, 0, 0, d, 0, 0);
          draw();
        }
        addEventListener("resize", resize);
        new ResizeObserver(resize).observe(canvas);
        function dims() {
          const h = canvas.clientHeight,
            lineBottom = phase === "playing" ? 25 : 45;
          return {
            w: canvas.clientWidth,
            h,
            line: Math.min(
              h - 8,
              Math.max(70, h - lineBottom - lineOffset),
            ),
            lane: canvas.clientWidth / 4,
          };
        }
        function drawLifeLine(context, width, line, laneWidth, misses, blur) {
          const lostFromLane = 4 - Math.min(4, misses);
          context.lineWidth = 3;
          for (let lane = 0; lane < 4; lane++) {
            const color = lane >= lostFromLane ? "#ff4964" : "#adff2f";
            context.strokeStyle = color;
            context.shadowColor = color;
            context.shadowBlur = blur;
            context.beginPath();
            context.moveTo(lane * laneWidth, line);
            context.lineTo((lane + 1) * laneWidth, line);
            context.stroke();
          }
          context.shadowBlur = 0;
        }
        function draw() {
          const { w, h, line, lane } = dims();
          ctx.clearRect(0, 0, w, h);
          ctx.fillStyle = "#070d0f";
          ctx.fillRect(0, 0, w, h);
          for (let i = 0; i < 4; i++) {
            ctx.fillStyle = i % 2 ? "#0b1316" : "#081013";
            ctx.fillRect(i * lane, 0, lane, h);
            ctx.strokeStyle = "#28343a";
            ctx.beginPath();
            ctx.moveTo(i * lane, 0);
            ctx.lineTo(i * lane, h);
            ctx.stroke();
          }
          drawLifeLine(ctx, w, line, lane, miss, 13);
          notes.forEach((n) => {
            const x = n.lane * lane + 7,
              y = n.y,
              nw = lane - 14,
              g = ctx.createLinearGradient(x, y, x + nw, y);
            g.addColorStop(0, "#73dfff");
            g.addColorStop(0.5, "#eaffff");
            g.addColorStop(1, "#adff2f");
            ctx.fillStyle = g;
            ctx.shadowColor = "#adff2f";
            ctx.shadowBlur = 10;
            ctx.fillRect(x, y, nw, 22);
            ctx.fillStyle = "#071006";
            ctx.font = "900 13px Arial";
            ctx.textAlign = "center";
            ctx.fillText(K[n.lane], x + nw / 2, y + 16);
            ctx.shadowBlur = 0;
          });
        }
        function paint() {
          q("#score").textContent = score.toLocaleString();
          q("#combo").textContent = combo;
          q("#speed").textContent = "×" + speed.toFixed(2);
          q("#speedFill").style.width = Math.min(100, (speed / 8) * 100) + "%";
          [...keys.children].forEach((x, i) =>
            x.classList.toggle("active", i === activeLane),
          );
        }
        function spawn() {
          let lane = Math.floor(Math.random() * 4);
          if (lane === lastLane)
            lane = (lane + 1 + Math.floor(Math.random() * 3)) % 4;
          lastLane = lane;
          const id = phase === "playing" ? nextNoteId++ : 0;
          notes.push({ id, lane, y: -28 });
          if (phase === "playing" && replayEvents.length < 12000)
            replayEvents.push([
              0,
              Math.max(0, Math.round(performance.now() - startAt)),
              id,
              lane,
            ]);
        }
        function preview(now) {
          if (phase !== "idle") return;
          const dt = Math.min(34, now - lastAt || 16);
          lastAt = now;
          if (now - previewAt > 820) {
            spawn();
            previewAt = now;
          }
          const { line } = dims();
          notes.forEach((n) => (n.y += BASE * highSpeed * dt));
          notes = notes.filter((n) => n.y < line + 35);
          draw();
          raf = requestAnimationFrame(preview);
        }
        function showJudge(text, cls) {
          clearTimeout(judgeTimer);
          overlay.innerHTML =
            '<div class="judge ' + cls + '">' + text + "</div>";
          judgeTimer = setTimeout(() => {
            if (phase === "playing") overlay.innerHTML = "";
          }, 250);
        }
        function addMiss(noteId = null) {
          miss++;
          combo = 0;
          if (noteId && replayEvents.length < 12000)
            replayEvents.push([
              2,
              Math.max(0, Math.round(performance.now() - startAt)),
              noteId,
            ]);
          showJudge("MISS", "miss");
          paint();
          if (miss >= 4) end();
        }
        function press(lane, automatic = false) {
          if (phase !== "playing" || (demoMode && !automatic)) return;
          activeLane = lane;
          paint();
          setTimeout(() => {
            if (activeLane === lane) {
              activeLane = -1;
              paint();
            }
          }, 80);
          const { line } = dims();
          let best = -1,
            dist = Infinity;
          notes.forEach((n, i) => {
            if (n.lane === lane) {
              const d = Math.abs(n.y + 11 - line);
              if (d < dist) {
                dist = d;
                best = i;
              }
            }
          });
          if (best < 0 || (!automatic && dist > 76)) return;
          if (automatic) dist = 0;
          const hitNote = notes.splice(best, 1)[0];
          let value, label, cls;
          if (dist <= 20) {
            value = 100;
            label = "PERFECT";
            cls = "perfect";
            perfectCount++;
          } else if (dist <= 42) {
            value = 80;
            label = "GREAT";
            cls = "great";
            greatCount++;
          } else {
            value = 50;
            label = "GOOD";
            cls = "good";
            goodCount++;
          }
          if (replayEvents.length < 12000)
            replayEvents.push([
              1,
              Math.max(0, Math.round(performance.now() - startAt)),
              hitNote.id,
              value === 100 ? 0 : value === 80 ? 1 : 2,
            ]);
          combo++;
          bestCombo = Math.max(bestCombo, combo);
          score += Math.round(
            value * speed * (1 + Math.min(combo, 50) * 0.01) * hsScore(),
          );
          maxSpeed = Math.max(maxSpeed, speed);
          showJudge(label, cls);
          paint();
          if (demoMode && score >= 1000000 && !demoEnding) finishDemo();
        }
        function finishDemo() {
          demoEnding = true;
          notes = [];
          activeLane = -1;
          draw();
          [350, 700, 1050, 1400].forEach((delay) => {
            setTimeout(() => {
              if (phase === "playing") addMiss();
            }, delay);
          });
        }
        function getDensityInterval() {
          const densityIntervals = [1050, 900, 760, 640, 530, 440, 360];
          if (speed <= 4) {
            const level = Math.min(6, Math.floor((speed - 1) / 0.5));
            return densityIntervals[level];
          }
          if (speed <= 6) return densityIntervals[6];
          const lateIntervals = [290, 230, 180, 140];
          const lateLevel = Math.min(
            lateIntervals.length - 1,
            Math.floor((speed - 6.1) / 0.5),
          );
          return lateIntervals[Math.max(0, lateLevel)];
        }
        function getScrollSpeed() {
          if (speed <= 4) return 1;
          return 1 + (speed - 4);
        }
        function loop(now) {
          if (phase !== "playing") return;
          const dt = Math.min(34, now - lastAt);
          lastAt = now;
          const rawSpeed = Math.min(8, 1 + (now - startAt) / 30000);
          speed = Math.floor(rawSpeed * 10 + 0.000001) / 10;
          maxSpeed = Math.max(maxSpeed, speed);
          if (!demoEnding) {
            const interval = getDensityInterval();
            if (now - lastSpawn >= interval) {
              spawn();
              lastSpawn = now;
            }
            const { line } = dims();
            notes.forEach((n) => {
              n.previousY = n.y;
              n.y += BASE * getScrollSpeed() * highSpeed * dt;
            });
            if (demoMode) {
              const autoLanes = notes
                .filter(
                  (n) =>
                    Math.abs(n.y + 11 - line) <= 20 ||
                    (n.previousY + 11 < line && n.y + 11 >= line),
                )
                .map((n) => n.lane);
              for (const lane of autoLanes) {
                if (demoEnding) break;
                press(lane, true);
              }
            }
            for (let i = notes.length - 1; i >= 0; i--) {
              if (notes[i].y > line + 58) {
                const missedNote = notes.splice(i, 1)[0];
                addMiss(missedNote.id);
                if (phase !== "playing") break;
              }
            }
          }
          draw();
          paint();
          raf = requestAnimationFrame(loop);
        }
        function start() {
          cancelAnimationFrame(raf);
          phase = "count";
          document.body.classList.add("playing");
          notes = [];
          score = combo = bestCombo = miss = 0;
          perfectCount = greatCount = goodCount = 0;
          speed = maxSpeed = 1;
          activeLane = -1;
          replayEvents = [];
          nextNoteId = 1;
          runDuration = 0;
          demoMode = q("#demoMode").checked;
          demoEnding = false;
          paint();
          q("#submit").style.display = "none";
          let n = 3;
          overlay.innerHTML = '<div class="count">3</div>';
          resize();
          const t = setInterval(() => {
            n--;
            if (!n) {
              clearInterval(t);
              phase = "playing";
              overlay.innerHTML = "";
              startAt = lastAt = performance.now();
              lastSpawn = startAt - 600;
              raf = requestAnimationFrame(loop);
            } else overlay.innerHTML = '<div class="count">' + n + "</div>";
          }, 700);
        }
        function end() {
          runDuration = Math.max(0, Math.round(performance.now() - startAt));
          phase = "over";
          cancelAnimationFrame(raf);
          notes = [];
          activeLane = -1;
          const old = Number(localStorage.getItem("accel-keys-best") || 0);
          if (!demoMode) {
            const best = Math.max(old, score);
            localStorage.setItem("accel-keys-best", best);
            q("#myBest").textContent = best.toLocaleString();
          }
          overlay.innerHTML =
            '<div class="result"><div class="eyebrow">RUN COMPLETE</div><h2>' +
            score.toLocaleString() +
            '</h2><div class="resultline"><span>最高コンボ <b>' +
            bestCombo +
            "</b></span><span>最高速度 <b>×" +
            maxSpeed.toFixed(2) +
            "</b></span><span>HS <b>" +
            highSpeed.toFixed(2) +
            "</b></span></div></div>";
          q("#start").textContent = "タイトルに戻る";
          q("#start").onclick = () => location.reload();
          resize();
          paint();
          setTimeout(() => {
            document.body.classList.remove("playing");
            q("#submit").style.display =
              score > 0 && !demoMode ? "grid" : "none";
            q("#message").textContent = demoMode
              ? "おてほんモードのスコアは記録されません。"
              : "";
            resize();
          }, 1000);
        }
        q("#start").onclick = start;
        addEventListener("keydown", (e) => {
          const lane = K.indexOf(e.key.toUpperCase());
          if (lane >= 0 && !e.repeat) {
            e.preventDefault();
            press(lane);
          }
          if (e.key === " " && phase === "idle") {
            e.preventDefault();
            start();
          }
        });
        function esc(s) {
          const d = document.createElement("div");
          d.textContent = s;
          return d.innerHTML;
        }
        const replayCanvas = q("#replayCanvas"),
          replayCtx = replayCanvas.getContext("2d");
        let replayRaf = 0,
          currentReplay = null;
        function closeReplay() {
          cancelAnimationFrame(replayRaf);
          currentReplay = null;
          q("#replayModal").hidden = true;
          document.body.style.overflow = "";
        }
        q("#replayClose").onclick = closeReplay;
        q("#replayModal").onclick = (e) => {
          if (e.target === q("#replayModal")) closeReplay();
        };
        addEventListener("keydown", (e) => {
          if (e.key === "Escape" && !q("#replayModal").hidden) closeReplay();
        });
        function setReplayCanvasSize() {
          const rect = replayCanvas.getBoundingClientRect(),
            d = Math.min(devicePixelRatio || 1, 2);
          replayCanvas.width = Math.max(1, Math.round(rect.width * d));
          replayCanvas.height = Math.max(1, Math.round(rect.height * d));
          replayCtx.setTransform(d, 0, 0, d, 0, 0);
        }
        function drawReplayFrame(replay, elapsed) {
          const w = replayCanvas.clientWidth,
            h = replayCanvas.clientHeight,
            laneWidth = w / 4,
            line = Math.min(
              h - 8,
              Math.max(70, h - 45 - Number(replay.lineOffset || 0)),
            );
          replayCtx.clearRect(0, 0, w, h);
          replayCtx.fillStyle = "#070d0f";
          replayCtx.fillRect(0, 0, w, h);
          for (let lane = 0; lane < 4; lane++) {
            replayCtx.fillStyle = lane % 2 ? "#0b1316" : "#081013";
            replayCtx.fillRect(lane * laneWidth, 0, laneWidth, h);
            replayCtx.strokeStyle = "#28343a";
            replayCtx.beginPath();
            replayCtx.moveTo(lane * laneWidth, 0);
            replayCtx.lineTo(lane * laneWidth, h);
            replayCtx.stroke();
          }
          let replayMisses = replay.notes.filter(
            (note) => note.type === 2 && note.end <= elapsed,
          ).length;
          if ((replay.missLimit ?? 3) < 4 && elapsed >= replay.duration)
            replayMisses = 4;
          drawLifeLine(
            replayCtx,
            w,
            line,
            laneWidth,
            replayMisses,
            10,
          );
          for (const note of replay.notes) {
            if (elapsed < note.spawn || elapsed > note.end) continue;
            const span = Math.max(1, note.end - note.spawn),
              progress = Math.min(1, (elapsed - note.spawn) / span),
              target = note.type === 2 ? line + 58 : line - 11,
              y = -28 + (target + 28) * progress,
              x = note.lane * laneWidth + 7,
              nw = laneWidth - 14,
              gradient = replayCtx.createLinearGradient(x, y, x + nw, y);
            gradient.addColorStop(0, "#73dfff");
            gradient.addColorStop(0.5, "#eaffff");
            gradient.addColorStop(1, "#adff2f");
            replayCtx.fillStyle = gradient;
            replayCtx.shadowColor = "#adff2f";
            replayCtx.shadowBlur = 8;
            replayCtx.fillRect(x, y, nw, 22);
            replayCtx.fillStyle = "#071006";
            replayCtx.font = "900 13px Arial";
            replayCtx.textAlign = "center";
            replayCtx.fillText(K[note.lane], x + nw / 2, y + 16);
            replayCtx.shadowBlur = 0;
          }
          const recent = [...replay.notes]
            .reverse()
            .find(
              (note) =>
                note.type !== null &&
                elapsed >= note.end &&
                elapsed - note.end < 280,
            );
          const labels = ["PERFECT", "GREAT", "GOOD"];
          q("#replayJudge").textContent = recent
            ? recent.type === 2
              ? "MISS"
              : labels[recent.judgement]
            : "";
          q("#replayJudge").className =
            "replay-judge " +
            (recent
              ? recent.type === 2
                ? "miss"
                : ["perfect", "great", "good"][recent.judgement]
              : "");
        }
        function buildReplay(data) {
          const notes = new Map();
          for (const event of data.events) {
            if (event[0] === 0) {
              notes.set(event[2], {
                id: event[2],
                lane: event[3],
                spawn: event[1],
                end: data.duration,
                type: null,
                judgement: null,
              });
            } else {
              const note = notes.get(event[2]);
              if (!note) continue;
              note.end = event[1];
              note.type = event[0];
              note.judgement = event[0] === 1 ? event[3] : null;
            }
          }
          return { ...data, notes: [...notes.values()] };
        }
        function playReplay() {
          if (!currentReplay) return;
          cancelAnimationFrame(replayRaf);
          setReplayCanvasSize();
          const started = performance.now();
          q("#replayStatus").textContent = "リプレイ再生中";
          function frame(now) {
            const elapsed = Math.min(
              currentReplay.duration,
              Math.round(now - started),
            );
            drawReplayFrame(currentReplay, elapsed);
            q("#replayStatus").textContent =
              `リプレイ ${Math.floor(elapsed / 1000)}秒 / ${Math.ceil(currentReplay.duration / 1000)}秒`;
            if (elapsed < currentReplay.duration)
              replayRaf = requestAnimationFrame(frame);
            else q("#replayStatus").textContent = "リプレイ終了";
          }
          replayRaf = requestAnimationFrame(frame);
        }
        q("#replayPlay").onclick = playReplay;
        async function openRecord(id) {
          cancelAnimationFrame(replayRaf);
          currentReplay = null;
          q("#replayModal").hidden = false;
          document.body.style.overflow = "hidden";
          q("#replayTitle").textContent = "記録詳細";
          q("#replayStats").innerHTML = "";
          q("#replayStatus").textContent = "記録を読み込んでいます…";
          q("#replayPlay").disabled = true;
          setReplayCanvasSize();
          replayCtx.clearRect(0, 0, replayCanvas.clientWidth, replayCanvas.clientHeight);
          try {
            const response = await fetch("/api/scores?id=" + id),
              data = await response.json();
            if (!response.ok) throw Error(data.error);
            const record = data.record,
              hasReplay = Boolean(record.replay);
            q("#replayTitle").textContent = record.name;
            const stats = [
              ["スコア", Number(record.score).toLocaleString()],
              ["最大コンボ", record.bestCombo],
              ["最大速度", "×" + Number(record.maxSpeed).toFixed(2)],
              ["HIGH SPEED", hasReplay ? "HS " + Number(record.highSpeed).toFixed(2) : "—"],
              ["PERFECT", hasReplay ? record.perfect : "—"],
              ["GREAT", hasReplay ? record.great : "—"],
              ["GOOD", hasReplay ? record.good : "—"],
              ["MISS", hasReplay ? record.miss : "—"],
            ];
            q("#replayStats").innerHTML = stats
              .map(([label, value]) => `<div><small>${label}</small><b>${value}</b></div>`)
              .join("");
            if (!hasReplay) {
              q("#replayStatus").textContent =
                "この記録には判定内訳・リプレイデータがありません。";
              return;
            }
            currentReplay = buildReplay(record.replay);
            q("#replayPlay").disabled = false;
            playReplay();
          } catch (error) {
            q("#replayStatus").textContent =
              error.message || "記録を読み込めませんでした。";
          }
        }
        async function rankings() {
          try {
            const r = await fetch("/api/scores"),
              d = await r.json();
            if (!r.ok) throw Error();
            q("#worldBest").textContent = Number(
              d.worldBest || 0,
            ).toLocaleString();
            q("#ranking").innerHTML = d.scores.length
              ? d.scores
                  .map(
                    (x, i) =>
                      '<li data-id="' +
                      Number(x.id) +
                      '" tabindex="0" role="button"><span>' +
                      (i + 1) +
                      "</span><span>" +
                      esc(x.name) +
                      "</span><b>" +
                      Number(x.score).toLocaleString() +
                      "</b><small>最高速度 ×" +
                      Number(x.maxSpeed).toFixed(2) +
                      "</small></li>",
                  )
                  .join("")
              : "<li><span>—</span><span>まだ記録がありません</span></li>";
            q("#ranking")
              .querySelectorAll("li[data-id]")
              .forEach((item) => {
                item.onclick = () => openRecord(Number(item.dataset.id));
                item.onkeydown = (event) => {
                  if (event.key === "Enter" || event.key === " ") {
                    event.preventDefault();
                    openRecord(Number(item.dataset.id));
                  }
                };
              });
          } catch {
            q("#ranking").innerHTML =
              "<li><span>!</span><span>ランキングに接続できません</span></li>";
            q("#worldBest").textContent = "OFFLINE";
          }
        }
        q("#submit").onsubmit = async (e) => {
          e.preventDefault();
          const b = e.currentTarget.querySelector("button");
          const enteredName = q("#player").value.trim();
          const normalizedName = enteredName
            .normalize("NFKC")
            .replace(/\s/g, "");
          const creatorName =
            normalizedName === "ゆめみねこ" ||
            normalizedName === "ゆめみねこ(製作者)";
          let adminToken = "";
          if (creatorName) {
            const enteredToken = prompt(
              "製作者名で登録するには、管理者メニューパスワードを入力してください。",
            );
            if (enteredToken === null) {
              q("#message").textContent = "登録をキャンセルしました。";
              return;
            }
            adminToken = enteredToken;
          }
          b.disabled = true;
          q("#message").textContent = "送信中…";
          try {
            const r = await fetch("/api/scores", {
                method: "POST",
                headers: {
                  "content-type": "application/json",
                  ...(adminToken
                    ? { authorization: "Bearer " + adminToken }
                    : {}),
                },
                body: JSON.stringify({
                  name: enteredName,
                  score,
                  maxSpeed,
                  bestCombo,
                  perfect: perfectCount,
                  great: greatCount,
                  good: goodCount,
                  miss,
                  highSpeed,
                  replay: {
                    version: 1,
                    duration: runDuration,
                    lineOffset,
                    missLimit: 4,
                    events: replayEvents,
                  },
                }),
              }),
              d = await r.json();
            if (!r.ok) throw Error(d.error);
            q("#message").textContent = d.updated
              ? "ランキング記録を更新しました！"
              : "自己ベスト未更新のため、ランキング記録はそのままです。";
            q("#submit").style.display = "none";
            await rankings();
          } catch (x) {
            q("#message").textContent = x.message || "送信できませんでした";
          } finally {
            b.disabled = false;
          }
        };
        rankings();
        paint();
        resize();
        lastAt = performance.now();
        raf = requestAnimationFrame(preview);
      })();
    </script>
  </body>
</html>
