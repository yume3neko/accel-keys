<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ACCEL KEYS｜マルチプレイ</title>
<style>
:root{color-scheme:dark;--lime:#adff2f;--muted:#a1b0b6;--line:#2a353a;--red:#ff4964}*{box-sizing:border-box}body{margin:0;background:#060b0d;color:#f4f7f5;font:16px Arial,'Noto Sans JP',sans-serif}main{max-width:850px;margin:auto;padding:22px 16px}header{display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:18px}header b{letter-spacing:.08em}a{color:var(--lime)}h1{font-size:28px;margin:22px 0 12px}h2{font-size:20px}p{line-height:1.7;color:var(--muted)}button,input,select{font:inherit;border-radius:6px;padding:12px;min-width:0}button{background:var(--lime);color:#071006;border:0;font-weight:bold;cursor:pointer;min-height:44px}button:disabled{opacity:.45;cursor:default}input,select{background:#10191d;color:#fff;border:1px solid #425058;width:100%}label{display:grid;gap:8px;font-size:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card{background:#0d1519;border:1px solid var(--line);border-radius:10px;padding:18px;margin:16px 0}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.secondary{background:#253239;color:#fff}.danger{background:#391923;color:#ffb1bd}.small{font-size:14px}.code{font-size:30px;letter-spacing:.18em;color:var(--lime);font-weight:bold;overflow-wrap:anywhere}.members{display:grid;gap:8px}.member{border:1px solid var(--line);padding:10px;border-radius:6px;display:flex;justify-content:space-between;gap:10px}.member span{overflow-wrap:anywhere}.member small{color:var(--muted);font-size:13px}.member.out{opacity:.55}.message{min-height:24px;color:#fbc66b}#connection{font-size:14px;min-height:24px}#play{position:fixed;inset:0;background:#060b0d;z-index:10;display:flex;flex-direction:column;padding:max(6px,env(safe-area-inset-top)) 0 max(0px,env(safe-area-inset-bottom))}#play[hidden],[hidden]{display:none!important}.hud{display:flex;justify-content:space-between;align-items:center;padding:5px 12px;gap:8px;font-size:14px}.hud b{color:var(--lime);font-size:20px}.hud button{padding:5px 9px;font-size:14px}.rivals{display:flex;gap:5px;padding:4px 8px;overflow:auto}.rival{flex:1;min-width:80px;padding:5px;background:#10191d;border-left:3px solid var(--lime);font-size:12px}.rival.out{border-color:var(--red);opacity:.65}.rival strong{display:block;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rival span{display:block;color:var(--muted)}.board{position:relative;flex:1;min-height:80px}canvas{display:block;width:100%;height:100%;touch-action:none}#overlay{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-size:30px;font-weight:bold;pointer-events:none;padding:20px;text-shadow:0 2px 12px #000}#judge{position:absolute;inset:auto 0 25%;text-align:center;font-size:26px;pointer-events:none;font-weight:bold}.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:3px}.keys button{height:70px;background:#1c292f;color:#fff;border-bottom:4px solid #020404;border-radius:0;touch-action:none;font-size:26px}.keys button.active{background:var(--lime);color:#071006}#netStatus{text-align:center;background:#1b1510;color:#ffd792;font-size:13px;padding:3px;min-height:22px}.result-value{font-size:42px;color:var(--lime);margin:12px 0}#resultRows .member{margin:8px 0}input[type=range]{padding:6px;accent-color:var(--lime)}@media(max-width:520px){main{padding:16px 12px}.grid{grid-template-columns:1fr}.hud{flex-wrap:wrap}.hud b{font-size:18px}.card{padding:14px}.keys button{height:64px}.rival{font-size:12px}}
.creator-badge{display:inline-block;margin-left:6px;padding:2px 6px;border:1px solid #d6b75f;border-radius:4px;background:#302713;color:#ffe196;font-size:11px;font-weight:bold;line-height:1.4;vertical-align:middle;white-space:nowrap}
</style></head><body><main>
<header><b>ACCEL KEYS / MULTI</b><a href="/accel-keys/">ソロへ</a></header>
<section id="setup"><h1>みんなで加速する。</h1><p>2〜4人で同じ譜面に挑戦。ルームを作るか、友だちのルーム番号を入力してください。</p>
<label><span id="nameLabel">プレイヤー名</span><input id="name" maxlength="4096" autocomplete="nickname" placeholder="12文字まで"></label>
<div class="card"><div class="grid"><label>譜面<select id="mode"><option value="time">通常モード</option><option value="cosmos">加速する大宇宙</option></select></label><label>遊び方<select id="kind"><option value="battle">サバイバルバトル</option><option value="coop">協力モード</option></select></label></div><p id="rule" class="small"></p><button id="create">ルームを作る</button></div>
<form id="joinForm" class="card"><label>ルーム番号<input id="codeInput" maxlength="6" autocapitalize="characters" autocomplete="off" spellcheck="false" placeholder="例：ABCD23"></label><div class="actions"><button id="join">参加する</button></div></form></section>
<section id="lobby" hidden><h1 id="roomTitle">待機ルーム</h1><div class="card"><div class="small">ルーム番号</div><div id="roomCode" class="code"></div><div class="actions"><button id="copy" class="secondary">招待リンクをコピー</button><button id="leave" class="danger">退出</button></div><p id="roomRule" class="small"></p><div id="members" class="members"></div><div class="actions"><button id="addCPU" class="secondary" hidden>CPUを追加</button><button id="ready">準備完了</button><button id="start">全員でスタート</button></div></div>
<section class="card" style="display:flex;gap:12px;align-items:center"><label style="display:flex;align-items:center;gap:8px"><input id="guideEnabled" type="checkbox" style="width:18px">ガイド音</label><input id="guideVolume" aria-label="ガイド音の音量" type="range" min="0" max="100" step="5"><span style="font-size:12px">音量</span></section><div class="card"><div class="grid"><label>HIGH SPEED <span id="hsText"></span><input id="hs" type="range" min="0.5" max="2" step="0.1"></label><label>判定ライン <span id="lineText"></span><input id="line" type="range" min="-15" max="160" step="5"></label></div><p class="small">HSは見た目のみ。全員同じ判定幅・得点条件です。PERFECT ±60ms / GREAT ±110ms / GOOD ±170ms。開始後の設定変更はできません。</p></div></section>
<section id="results" hidden><h1 id="resultTitle"></h1><p id="resultReason"></p><div id="resultRows"></div><p class="small">マルチプレイの結果はソロランキングには送信されません。</p><button id="again">新しいルームで遊ぶ</button></section>
<p id="connection" role="status"></p><p id="message" class="message" role="alert"></p>
</main>
<section id="play" hidden><div class="hud"><span>SCORE <b id="score">0</b></span><span>COMBO <b id="combo">0</b></span><span>倍率 <b id="speed">×1.00</b></span><button id="quit" class="danger">退出</button></div><div class="hud"><span id="life"></span><span id="density"></span></div><div id="rivals" class="rivals"></div><div id="netStatus"></div><div class="board"><canvas id="canvas" aria-label="D F J K の4レーン"></canvas><div id="overlay"></div><div id="judge"></div></div><div class="keys"><button data-lane="0">D</button><button data-lane="1">F</button><button data-lane="2">J</button><button data-lane="3">K</button></div></section>
<script src="./metronome.js"></script><script type="module" src="./multiplayer.js"></script></body></html>
