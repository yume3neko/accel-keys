<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ACCEL KEYS</title><meta name="description" content="追いつける限り加速する鍵盤ゲーム"><style>
:root{color-scheme:dark;--lime:#b9ff38;--red:#ff4d62;--panel:#0c1215;--line:#2c373c}*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(circle at 50% 32%,#19271c,#080d0f 38%,#050709 75%);color:#f4f7f5;font-family:"Arial Narrow","Noto Sans JP",sans-serif}.app{min-height:100svh;display:grid;grid-template-rows:auto 1fr auto}.top{display:flex;justify-content:space-between;align-items:center;padding:18px clamp(18px,5vw,64px);border-bottom:1px solid var(--line);letter-spacing:.14em;font-weight:900}.logo b{display:inline-grid;place-items:center;width:28px;height:28px;margin-right:10px;background:var(--lime);color:#081006;clip-path:polygon(50% 0,100% 100%,0 100%);padding-top:8px}.bests{font-size:11px;color:#79858a}.bests strong{color:#fff;font-size:16px;margin-left:7px}.world{margin-left:18px;color:#91a070}.stage{width:min(820px,calc(100% - 28px));margin:auto;padding:20px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);background:#0b1013cc}.stat{display:flex;justify-content:space-between;align-items:baseline;padding:12px 18px;border-right:1px solid var(--line)}.stat:last-child{border:0}.stat span{font-size:11px;letter-spacing:.15em;color:#77838a}.stat b{font-size:24px}.stat .lime{color:var(--lime)}.speedbar,.timebar{height:4px;background:#20292d}.speedbar i,.timebar i{display:block;height:100%;width:12.5%;background:var(--lime);box-shadow:0 0 12px var(--lime)}.arena{height:clamp(245px,37vh,370px);display:grid;place-items:center;align-content:center;text-align:center}.eyebrow{font-size:11px;letter-spacing:.3em;color:#77838a;font-weight:900}.intro h1{font-size:clamp(42px,8vw,72px);line-height:1.02;letter-spacing:-.06em;margin:10px}.intro h1 em{color:var(--lime);font-style:normal}.intro p{color:#939da2;line-height:1.8}.target{font-size:clamp(120px,24vw,195px);font-weight:950;line-height:.85;animation:pop .12s}.timebar{width:min(280px,70vw);margin-top:28px}.timebar i{width:100%;background:linear-gradient(90deg,var(--red),#ffe338,var(--lime))}@keyframes pop{from{transform:scale(1.3);opacity:.2}}.count{font-size:150px;font-weight:950;color:var(--lime)}.result h2{font-size:clamp(68px,14vw,112px);line-height:1;color:var(--lime);margin:8px}.resultline{display:flex;gap:20px;justify-content:center;color:#899399}.hearts{height:22px;display:flex;justify-content:center;gap:8px}.hearts i{width:25px;height:4px;background:#394449}.hearts i.lost{background:var(--red);box-shadow:0 0 8px var(--red)}.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.keys button{height:76px;border:1px solid #3a464b;border-bottom:5px solid #020304;border-radius:7px;background:linear-gradient(#212a2e,#101619);color:#eef2ef;font-size:27px;font-weight:950;touch-action:manipulation}.keys button.active{color:var(--lime);border-color:var(--lime);box-shadow:inset 0 0 22px #b9ff381b}.keys button:active{transform:translateY(4px);border-bottom-width:1px;background:var(--lime);color:#071006}.controls{display:grid;grid-template-columns:1fr auto;gap:14px;margin-top:18px}.modes{display:grid;grid-template-columns:1fr 1fr;gap:7px}.modes button,.start{border:1px solid var(--line);border-radius:6px;background:#0b1013;color:#98a2a7;padding:10px 14px;text-align:left;font-weight:800}.modes button small{display:block;margin-top:3px;color:#657176}.modes button.on{color:var(--lime);border-color:var(--lime);background:#111b10}.start{min-width:175px;text-align:center;background:var(--lime);color:#081006;border:0;font-size:16px;cursor:pointer}.submit{margin-top:16px;display:none;grid-template-columns:1fr auto;gap:8px}.submit input{min-width:0;background:#0c1215;border:1px solid var(--line);border-radius:6px;color:#fff;padding:12px;font-size:16px}.submit button{background:var(--lime);color:#071006;border:0;border-radius:6px;padding:0 18px;font-weight:900}.message{text-align:center;min-height:20px;color:#9aa4a9;font-size:13px}.ranking{margin-top:20px;border-top:1px solid var(--line);padding-top:16px}.ranking h3{margin:0 0 10px;font-size:12px;letter-spacing:.18em;color:#7d888d}.ranking ol{margin:0;padding:0;list-style:none;display:grid;gap:5px}.ranking li{display:grid;grid-template-columns:35px 1fr auto auto;gap:10px;padding:8px 10px;background:#0b1013;border:1px solid #222b2f;border-radius:5px;font-size:13px}.ranking li b{color:var(--lime)}.ranking li small{color:#657176}footer{text-align:center;padding:15px;color:#536066;font-size:11px;border-top:1px solid #20282c}@media(max-width:600px){.top{padding:14px}.bests{font-size:9px}.world{display:block;margin:3px 0 0}.stage{padding:12px 0}.stat{display:block;text-align:center;padding:9px 5px}.stat span{display:block}.arena{height:34vh;min-height:230px}.keys button{height:68px}.controls{grid-template-columns:1fr}.start{height:51px}.ranking li{grid-template-columns:28px 1fr auto}.ranking li small{display:none}}
</style></head><body><div class="app"><header class="top"><div class="logo"><b>A</b>ACCEL KEYS</div><div class="bests">MY BEST <strong id="myBest">0</strong><span class="world">WORLD <strong id="worldBest">---</strong></span></div></header><main class="stage"><section class="stats"><div class="stat"><span>SCORE</span><b id="score">0</b></div><div class="stat"><span>COMBO</span><b id="combo">0</b></div><div class="stat"><span>SPEED</span><b class="lime" id="speed">×1.00</b></div></section><div class="speedbar"><i id="speedFill"></i></div><section class="arena" id="arena"><div class="intro"><div class="eyebrow">REACTION × ACCELERATION</div><h1>追いつける限り、<br><em>加速する。</em></h1><p>D・F・J・K。表示されたキーを時間内に叩こう。<br>3回ミスでゲームオーバー。</p></div></section><div class="hearts" id="hearts"><i></i><i></i><i></i></div><div class="keys" id="keys"></div><section class="controls" id="controls"><div class="modes"><button class="on" data-mode="time">時間で加速<small>12秒ごとに約＋1倍</small></button><button data-mode="hits">打数で加速<small>約10打ごとに＋0.35倍</small></button></div><button class="start" id="start">スタート</button></section><form class="submit" id="submit"><input id="player" maxlength="12" placeholder="プレイヤー名（12文字まで）" required><button>スコア送信</button></form><p class="message" id="message"></p><section class="ranking"><h3>GLOBAL TOP 10</h3><ol id="ranking"><li><span>—</span><span>読み込み中…</span></li></ol></section></main><footer>PC: D F J K ｜ スマホ: 画面の鍵盤</footer></div><script>
(()=>{const K=['D','F','J','K'],q=s=>document.querySelector(s),arena=q('#arena'),keys=q('#keys');let mode='time',phase='idle',target='F',score=0,combo=0,bestCombo=0,miss=0,speed=1,startAt=0,targetAt=0,raf=0,maxSpeed=1;const myBest=Number(localStorage.getItem('accel-keys-best')||0);q('#myBest').textContent=myBest.toLocaleString();K.forEach(k=>{const b=document.createElement('button');b.textContent=k;b.dataset.key=k;b.onpointerdown=()=>hit(k);keys.append(b)});document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('on',x===b))});const limit=()=>Math.max(260,1600/speed),paint=()=>{q('#score').textContent=score.toLocaleString();q('#combo').textContent=combo;q('#speed').textContent='×'+speed.toFixed(2);q('#speedFill').style.width=Math.min(100,speed/8*100)+'%';[...q('#hearts').children].forEach((x,i)=>x.classList.toggle('lost',i<miss));[...keys.children].forEach(x=>x.classList.toggle('active',phase==='playing'&&x.dataset.key===target))},pick=()=>{const a=K.filter(x=>x!==target);target=a[Math.floor(Math.random()*a.length)];targetAt=performance.now();arena.innerHTML='<div class="eyebrow">PRESS</div><div class="target">'+target+'</div><div class="timebar"><i id="timeFill"></i></div>';paint()},bad=()=>{miss++;combo=0;paint();if(miss>=3)end()},hit=k=>{if(phase!=='playing')return;if(k!==target){bad();return}const acc=Math.max(0,1-(performance.now()-targetAt)/limit());score+=Math.round(100*speed*(.7+acc*.6));combo++;bestCombo=Math.max(bestCombo,combo);if(mode==='hits')speed=Math.min(8,1+Math.floor(score/1000)*.35);maxSpeed=Math.max(maxSpeed,speed);pick()},loop=()=>{if(phase!=='playing')return;const now=performance.now();if(mode==='time')speed=Math.min(8,1+(now-startAt)/12000);maxSpeed=Math.max(maxSpeed,speed);const left=1-(now-targetAt)/limit(),f=q('#timeFill');if(f)f.style.width=Math.max(0,left*100)+'%';paint();if(left<=0&&phase==='playing'){bad();if(phase==='playing')pick()}raf=requestAnimationFrame(loop)},start=()=>{cancelAnimationFrame(raf);phase='count';score=combo=bestCombo=miss=0;speed=maxSpeed=1;paint();q('#controls').style.display='none';q('#submit').style.display='none';q('#message').textContent='';let n=3;arena.innerHTML='<div class="count">3</div>';const t=setInterval(()=>{n--;if(!n){clearInterval(t);phase='playing';startAt=performance.now();pick();raf=requestAnimationFrame(loop)}else arena.innerHTML='<div class="count">'+n+'</div>'},700)},end=()=>{phase='over';cancelAnimationFrame(raf);const old=Number(localStorage.getItem('accel-keys-best')||0),best=Math.max(old,score);localStorage.setItem('accel-keys-best',best);q('#myBest').textContent=best.toLocaleString();arena.innerHTML='<div class="result"><div class="eyebrow">RUN COMPLETE</div><h2>'+score.toLocaleString()+'</h2><div class="resultline"><span>最高コンボ <b>'+bestCombo+'</b></span><span>最高速度 <b>×'+maxSpeed.toFixed(2)+'</b></span></div></div>';q('#controls').style.display='grid';q('#start').textContent='もう一度';q('#submit').style.display=score>0?'grid':'none';paint()};q('#start').onclick=start;addEventListener('keydown',e=>{const k=e.key.toUpperCase();if(K.includes(k)&&!e.repeat){e.preventDefault();hit(k)}if(e.key===' '&&(phase==='idle'||phase==='over')){e.preventDefault();start()}});async function rankings(){try{const r=await fetch('/api/scores'),d=await r.json();if(!r.ok)throw Error();q('#worldBest').textContent=Number(d.worldBest||0).toLocaleString();q('#ranking').innerHTML=d.scores.length?d.scores.map((x,i)=>'<li><span>'+(i+1)+'</span><span>'+escape(x.name)+'</span><b>'+Number(x.score).toLocaleString()+'</b><small>'+ (x.mode==='hits'?'打数':'時間')+' ×'+Number(x.maxSpeed).toFixed(2)+'</small></li>').join(''):'<li><span>—</span><span>まだ記録がありません</span></li>'}catch{q('#ranking').innerHTML='<li><span>!</span><span>ランキングに接続できません</span></li>';q('#worldBest').textContent='OFFLINE'}}function escape(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}q('#submit').onsubmit=async e=>{e.preventDefault();const b=e.currentTarget.querySelector('button');b.disabled=true;q('#message').textContent='送信中…';try{const r=await fetch('/api/scores',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name:q('#player').value,score,mode,maxSpeed,bestCombo})}),d=await r.json();if(!r.ok)throw Error(d.error);q('#message').textContent='ランキングに登録しました！';q('#submit').style.display='none';await rankings()}catch(x){q('#message').textContent=x.message||'送信できませんでした'}finally{b.disabled=false}};rankings();paint()})();
</script></body></html>
